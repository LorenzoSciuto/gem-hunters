# Builds Windows and Linux packages (installer + portable) and the web build.
# Runs on its own only for master pushes: each one is a new version (see the
# version job), tagged v<version> and published as a GitHub Release, and the
# web build goes live on GitHub Pages (see deploy-web).
# Any branch can be built by hand (Actions > Build & release > Run workflow);
# manual runs never publish or deploy.
#
# Actions and the build image are pinned to a commit / digest, so a moved tag
# can't change what builds the game. Update the hash together with the comment.
name: Build & release

on:
  push:
    branches: [master]
  workflow_dispatch:

# master: one run at a time, in order, so the versions count up. A branch: a
# newer run replaces the one still going.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Least privilege: a job that writes asks for it.
permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  # The version is MAJOR.MINOR.PATCH. MAJOR.MINOR are bumped by hand in
  # config/version of project.godot (its PATCH is not read). PATCH counts by
  # itself: one more than the last tag v<MAJOR.MINOR>.*, so every push to
  # master is a new version, stamped into the game it exports.
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          v=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::project.godot version '$v' is not MAJOR.MINOR.PATCH"; exit 1; }
          base=${v%.*}
          last=$(git ls-remote --tags origin "refs/tags/v$base.*" | sed -n "s/.*refs\/tags\/v$base\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
          echo "version=$base.$(( ${last:--1} + 1 ))" >> "$GITHUB_OUTPUT"

  # The headless checks of tests/run.sh: the import (unused code and untyped
  # declarations are script errors) and the test scripts. Nothing is exported,
  # released or deployed when they fail.
  check:
    name: Checks
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tests/run.sh

  export:
    name: Export ${{ matrix.preset }}
    needs: [version, check]
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    strategy:
      matrix:
        include:
          - preset: Linux
            dir: linux
          - preset: Windows
            dir: windows
          - preset: Web
            dir: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image keeps the export templates under /root, but Actions sets HOME
      # elsewhere.
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Stamp the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: sed -i "s/^config\/version=.*/config\/version=\"$VERSION\"/" project.godot

      - name: Import assets
        run: godot --headless --path . --import

      # After the import, so the project's scripts load cleanly.
      - name: Write the version on the splash
        run: godot --headless --path . -s installer/stamp_splash.gd

      - name: Export
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p build/${{ matrix.dir }}
          godot --headless --path . --export-release "${{ matrix.preset }}"
          ls build/${{ matrix.dir }}/GemHunters* build/${{ matrix.dir }}/index.wasm 2>/dev/null | grep -q .
          # The .exe must carry our icon and version info (UTF-16 "Wennovate"), not Godot's.
          if [ "${{ matrix.dir }}" = windows ]; then
            grep -qaP 'W\x00e\x00n\x00n\x00o\x00v\x00a\x00t\x00e' build/windows/GemHunters.exe \
              || { echo "GemHunters.exe still has Godot's icon and metadata"; exit 1; }
          fi
          # Versioned file names, so no browser serves a cached old release.
          if [ "${{ matrix.dir }}" = web ]; then
            installer/version_web_build.sh build/web "$VERSION"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.dir }}
          path: build/${{ matrix.dir }}

  package-linux:
    name: Package Linux (.deb + portable)
    needs: [version, export]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-linux
          path: build/linux
      - name: Build packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          chmod +x build/linux/GemHunters.x86_64
          cp README.md LICENSE build/linux/
          tar -czf dist/GemHunters-linux-x86_64-portable.tar.gz -C build/linux .
          installer/linux/build-deb.sh build/linux/GemHunters.x86_64 "$VERSION" dist/GemHunters-linux-x86_64.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-linux
          path: dist/*

  package-windows:
    name: Package Windows (installer + portable)
    needs: [version, export]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-windows
          path: build/windows
      - name: Build packages
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $version = $env:VERSION
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item README.md, LICENSE build/windows/
          Compress-Archive -Path build/windows/* -DestinationPath dist/GemHunters-windows-x86_64-portable.zip
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" "/DBuildDir=$PWD\build\windows" "/DOutputDir=$PWD\dist" installer\windows\gem-hunters.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows
          path: dist/*

  # Publishes the web build on GitHub Pages (Settings > Pages > Source: GitHub
  # Actions). No server and no secrets: the job only gets a short-lived token.
  deploy-web:
    name: Deploy web build to GitHub Pages
    needs: export
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-web
          path: build/web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: Tag & publish release
    needs: [version, package-linux, package-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Gem Hunters $TAG" --generate-notes

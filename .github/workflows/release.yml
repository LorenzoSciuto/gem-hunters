# Builds portable Windows and Linux packages on every PR and master push;
# a v* tag also publishes them as a GitHub Release.
name: Build & release

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export:
    name: Export ${{ matrix.preset }}
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    strategy:
      matrix:
        include:
          - preset: Linux
            dir: linux
            package: GemHunters-linux-x86_64.tar.gz
          - preset: Windows
            dir: windows
            package: GemHunters-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      # The image keeps templates under /root, but Actions sets HOME elsewhere.
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/

      - name: Import assets
        run: godot --headless --path . --import

      - name: Export
        run: |
          mkdir -p build/${{ matrix.dir }}
          godot --headless --path . --export-release "${{ matrix.preset }}"
          test -s build/${{ matrix.dir }}/GemHunters*

      - name: Package
        run: |
          cp README.md LICENSE build/${{ matrix.dir }}/
          cd build/${{ matrix.dir }}
          case "${{ matrix.package }}" in
            *.zip) zip -r ../${{ matrix.package }} . ;;
            *) chmod +x GemHunters.x86_64; tar -czf ../${{ matrix.package }} . ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: build/${{ matrix.package }}

  release:
    name: Publish release
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

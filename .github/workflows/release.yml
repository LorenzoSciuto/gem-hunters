# Builds Windows and Linux packages (installer + portable). Runs on its own
# only for master pushes: a version (config/version in project.godot) with no
# release yet is tagged v<version> and published. Any branch can be built by
# hand (Actions > Build & release > Run workflow); manual runs never publish.
name: Build & release

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export:
    name: Export ${{ matrix.preset }}
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    strategy:
      matrix:
        include:
          - preset: Linux
            dir: linux
          - preset: Windows
            dir: windows
    steps:
      - uses: actions/checkout@v4

      # The image keeps templates and editor settings (rcedit + wine paths, used
      # to write the icon and version info into the .exe) under /root, but
      # Actions sets HOME elsewhere.
      - name: Install export templates and editor settings
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          cp -r /root/.config/godot ~/.config/

      - name: Import assets
        run: godot --headless --path . --import

      - name: Export
        env:
          # wine (runs rcedit) refuses a HOME the container user doesn't own.
          WINEPREFIX: /tmp/wine
          WINEDEBUG: -all
        run: |
          mkdir -p build/${{ matrix.dir }}
          godot --headless --path . --export-release "${{ matrix.preset }}"
          test -s build/${{ matrix.dir }}/GemHunters*
          # The .exe must carry our icon and version info (UTF-16 "Wennovate"), not Godot's.
          if [ "${{ matrix.dir }}" = windows ]; then
            grep -qaP 'W\x00e\x00n\x00n\x00o\x00v\x00a\x00t\x00e' build/windows/GemHunters.exe \
              || { echo "GemHunters.exe still has Godot's icon and metadata"; exit 1; }
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.dir }}
          path: build/${{ matrix.dir }}

  package-linux:
    name: Package Linux (.deb + portable)
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/linux
      - name: Build packages
        run: |
          VERSION="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)"
          mkdir -p dist
          chmod +x build/linux/GemHunters.x86_64
          cp README.md LICENSE build/linux/
          tar -czf dist/GemHunters-linux-x86_64-portable.tar.gz -C build/linux .
          installer/linux/build-deb.sh build/linux/GemHunters.x86_64 "$VERSION" dist/GemHunters-linux-x86_64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: dist/*

  package-windows:
    name: Package Windows (installer + portable)
    needs: export
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: build/windows
      - name: Build packages
        shell: pwsh
        run: |
          $version = (Select-String -Path project.godot -Pattern '^config/version="(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item README.md, LICENSE build/windows/
          Compress-Archive -Path build/windows/* -DestinationPath dist/GemHunters-windows-x86_64-portable.zip
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" "/DBuildDir=$PWD\build\windows" "/DOutputDir=$PWD\dist" installer\windows\gem-hunters.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: dist/*

  release:
    name: Tag & publish release
    needs: [package-linux, package-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: bump config/version in project.godot to publish a new one."
            exit 0
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Gem Hunters $TAG" --generate-notes
